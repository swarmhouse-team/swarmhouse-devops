name: swarmhouse-project

services:
  api:
    image: ghcr.io/swarmhouse-team/swarmhouse-api:${APP_VERSION:?Set APP_VERSION}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      CACHE_DRIVER: redis
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      CACHE_KEY_PREFIX: "swarmhouse:"
      WAREHOUSE_SOCKET_ORIGINS: ${WAREHOUSE_SOCKET_ORIGINS:-}
    networks:
      - default
      - infra

  web:
    image: ghcr.io/swarmhouse-team/swarmhouse-web:${APP_VERSION:?Set APP_VERSION}
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:80"
    volumes:
      - type: bind
        source: ./../swarmhouse-devops/conf/nginx/swarmhouse.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false

networks:
  infra:
    external: true
