name: infrastructure_server

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *common
    image: postgres:18.7-trixie
    env_file:
      - ./env/postgres.env
    environment:
      TZ: ${TZ:-UTC}
    cpus: 0.75
    mem_limit: 1g
    shm_size: 128m
    stop_grace_period: 60s
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
      - type: bind
        source: ./conf/postgres/postgresql.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - infra

  redis:
    <<: *common
    image: redis:8.10-trixie
    env_file:
      - ./env/redis.env
    cpus: 0.25
    mem_limit: 256m
    stop_grace_period: 30s
    command:
      - sh
      - -ec
      - |
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
        exec redis-server /usr/local/etc/redis/redis.conf \
          --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - type: bind
        source: ./data/redis
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./conf/redis/redis.conf
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli -h 127.0.0.1 ping | grep -qx PONG'
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - infra

networks:
  infra:
    name: infra
    external: true