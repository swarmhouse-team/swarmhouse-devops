global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: node-exporter
    scrape_interval: 15s
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          server: swarmhous
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          server: swarmhous

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          server: swarmhous