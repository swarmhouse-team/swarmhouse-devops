---
- name: "Перечитать корень {{ data_root }} перед сменой владельца"
  ansible.builtin.stat:
    path: "{{ devops_checkout }}/{{ data_root }}"
  register: data_root_stat

- name: "Решить, менять ли только корень {{ data_root }}"
  ansible.builtin.set_fact:
    data_root_plan: >-
      {{
        (data_root_stat.stat.exists | bool) | postgres_dir_plan(
          data_root_stat.stat.uid | default(0),
          data_root_stat.stat.gid | default(0),
          data_root_stat.stat.mode | default(''),
          data_uid,
          data_gid
        )
      }}

- name: "Создать корень {{ data_root }} или выставить ему режим 0700"
  ansible.builtin.file:
    path: "{{ devops_checkout }}/{{ data_root }}"
    state: directory
    mode: "0700"
    recurse: false

- name: "Назначить корень {{ data_root }} пользователю из образа"
  ansible.builtin.command:
    argv:
      - chown
      - "{{ data_uid }}:{{ data_gid }}"
      - "{{ devops_checkout }}/{{ data_root }}"
  when: data_root_plan.chown | bool
  changed_when: true

- name: "Перечитать корень {{ data_root }} после изменения"
  ansible.builtin.stat:
    path: "{{ devops_checkout }}/{{ data_root }}"
  register: data_root_ready

- name: "Сверить корень {{ data_root }} с пользователем образа"
  ansible.builtin.set_fact:
    data_root_after: >-
      {{
        (data_root_ready.stat.exists | bool) | postgres_dir_plan(
          data_root_ready.stat.uid | default(0),
          data_root_ready.stat.gid | default(0),
          data_root_ready.stat.mode | default(''),
          data_uid,
          data_gid
        )
      }}

- name: "Остановить, если корень {{ data_root }} снова не принадлежит пользователю образа"
  ansible.builtin.fail:
    msg: >-
      {{ devops_checkout }}/{{ data_root }} принадлежит
      {{ data_root_ready.stat.uid | default('нет') }}:{{ data_root_ready.stat.gid | default('нет') }},
      режим {{ data_root_ready.stat.mode | default('нет') }},
      а образ {{ data_image }} ожидает
      {{ data_uid }}:{{ data_gid }} и 0700.
      Содержимое каталога не менял.
  when: data_root_after.action != 'keep'
