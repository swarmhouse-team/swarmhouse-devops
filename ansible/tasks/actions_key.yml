---
- name: Подготовить локальный каталог ключа Actions
  ansible.builtin.file:
    path: "{{ local_vps_dir }}/github-actions"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Подготовить локальную пару ключей Actions
  community.crypto.openssh_keypair:
    path: "{{ local_vps_dir }}/github-actions/id_ed25519"
    type: ed25519
    comment: "{{ devops_actions_comment }}"
    mode: "0600"
    regenerate: fail
  delegate_to: localhost
  become: false
  register: actions_keypair
  no_log: true

- name: Подготовить отдельную пару ключей Actions приложения
  community.crypto.openssh_keypair:
    path: "{{ local_vps_dir }}/github-actions/app_id_ed25519"
    type: ed25519
    comment: github-actions@swarmhouse-app
    mode: "0600"
    regenerate: fail
  delegate_to: localhost
  become: false
  register: app_actions_keypair
  no_log: true

- name: Подготовить системный каталог ключей SSH
  ansible.builtin.file:
    path: /etc/ssh/authorized_keys
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Установить обработчики команд SSH
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/{{ item }}.sh"
    dest: "/usr/local/sbin/swarmhouse-{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - infra-deploy-ssh
    - app-deploy-ssh

- name: Установить ограниченные ключи Actions
  ansible.builtin.copy:
    dest: "/etc/ssh/authorized_keys/{{ deploy_user }}"
    content: |
      restrict,command="/usr/local/sbin/swarmhouse-infra-deploy-ssh" {{ actions_keypair.public_key | trim }}
      restrict,command="/usr/local/sbin/swarmhouse-app-deploy-ssh" {{ app_actions_keypair.public_key | trim }}
    owner: root
    group: root
    mode: "0644"
  no_log: true

- name: Настроить системный файл ключей для deploy
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    insertafter: EOF
    marker: "# {mark} ANSIBLE MANAGED BLOCK SWARMHOUSE DEPLOY"
    block: |
      Match User {{ deploy_user }}
          AuthorizedKeysFile /etc/ssh/authorized_keys/%u
          AuthorizedKeysCommand none
          AuthenticationMethods publickey
    validate: /usr/sbin/sshd -t -f %s
  notify: Перечитать конфигурацию SSH
