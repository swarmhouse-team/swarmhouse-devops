---
- name: Подготовить локальный каталог ключа Actions
  ansible.builtin.file:
    path: "{{ local_vps_dir }}/github-actions"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Проверить локальную пару ключа Actions
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ local_vps_dir }}/github-actions/id_ed25519"
    - "{{ local_vps_dir }}/github-actions/id_ed25519.pub"
  loop_control:
    label: "{{ item }}"
  register: local_actions_key_stats
  delegate_to: localhost
  become: false

- name: Проверить legacy-файлы ключа на VPS
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ devops_actions_key }}"
    - "{{ devops_actions_pub }}"
  loop_control:
    label: "{{ item }}"
  register: server_actions_key_stats

- name: Выбрать действие для локальной пары
  ansible.builtin.set_fact:
    actions_key_plan: >-
      {{
        {
          'local_private': local_actions_key_stats.results[0].stat.exists,
          'local_public': local_actions_key_stats.results[1].stat.exists,
          'server_private': server_actions_key_stats.results[0].stat.exists,
          'server_public': server_actions_key_stats.results[1].stat.exists
        } | classify_actions_key
      }}

- name: Остановить, если локально остался только публичный ключ
  ansible.builtin.fail:
    msg: >-
      В {{ local_vps_dir }}/github-actions есть id_ed25519.pub и нет приватного ключа.
      Новую пару не создаю и файлы не перезаписываю.
      Восстановите приватный ключ из защищённой копии или заведите новое окружение
      с другим local_vps_dir.
  when: actions_key_plan.reason == 'orphan_local_pub'

- name: Остановить, если на VPS остался legacy-ключ, а локальной пары нет
  ansible.builtin.fail:
    msg: >-
      На VPS есть {{ devops_actions_key }} или {{ devops_actions_pub }},
      а локального приватного ключа нет. Новую пару не создаю и legacy-файлы не скачиваю.
      Восстановление прежнего ключа: положите сохранённую пару в
      {{ local_vps_dir }}/github-actions и повторите bootstrap.
      Новая идентичность — отдельное решение: playbook его не принимает,
      пока на VPS лежат legacy-файлы, а локальной пары нет.
  when: actions_key_plan.reason == 'legacy_without_local'

- name: Получить публичную часть из локального приватного ключа
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -y
      - -f
      - "{{ local_vps_dir }}/github-actions/id_ed25519"
  register: local_actions_pub_derived
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true
  diff: false
  when: actions_key_plan.action == 'derive'

- name: Записать отсутствующий локальный публичный ключ
  ansible.builtin.copy:
    dest: "{{ local_vps_dir }}/github-actions/id_ed25519.pub"
    content: "{{ local_actions_pub_derived.stdout | default('') }}\n"
    mode: "0644"
    force: false
  delegate_to: localhost
  become: false
  no_log: true
  diff: false
  when: actions_key_plan.action == 'derive'

- name: Сгенерировать локальную пару только если приватного ключа нет
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -q
      - -t
      - ed25519
      - -N
      - ""
      - -C
      - "{{ devops_actions_comment }}"
      - -f
      - "{{ local_vps_dir }}/github-actions/id_ed25519"
  args:
    creates: "{{ local_vps_dir }}/github-actions/id_ed25519"
  delegate_to: localhost
  become: false
  no_log: true
  diff: false
  when: actions_key_plan.action == 'generate'

- name: Повторно проверить локальную пару
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ local_vps_dir }}/github-actions/id_ed25519"
    - "{{ local_vps_dir }}/github-actions/id_ed25519.pub"
  loop_control:
    label: "{{ item }}"
  register: local_actions_key_stats
  delegate_to: localhost
  become: false

- name: Остановить, если локальная пара так и не собрана
  ansible.builtin.fail:
    msg: >-
      Локальная пара {{ local_vps_dir }}/github-actions не собрана.
      Приватный ключ на VPS не копирую.
  when: >-
    not (local_actions_key_stats.results[0].stat.exists | bool)
    or not (local_actions_key_stats.results[1].stat.exists | bool)

- name: Вывести публичную часть локального приватного ключа
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -y
      - -f
      - "{{ local_vps_dir }}/github-actions/id_ed25519"
  register: local_actions_pub_check
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true
  diff: false

- name: Прочитать локальный публичный файл
  ansible.builtin.slurp:
    src: "{{ local_vps_dir }}/github-actions/id_ed25519.pub"
  register: local_actions_pub_slurp
  delegate_to: localhost
  become: false
  no_log: true
  diff: false

- name: Остановить, если локальные публичный и приватный ключи не пара
  ansible.builtin.fail:
    msg: >-
      Локальные id_ed25519 и id_ed25519.pub не совпадают по типу или key material.
      Комментарий в сравнении не участвует. Файлы не перезаписываю.
  when: >-
    not (
      (local_actions_pub_slurp.content | b64decode)
      | same_public(local_actions_pub_check.stdout)
    )

- name: Права локального приватного ключа
  ansible.builtin.file:
    path: "{{ local_vps_dir }}/github-actions/id_ed25519"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Проверить режим локального приватного ключа
  ansible.builtin.stat:
    path: "{{ local_vps_dir }}/github-actions/id_ed25519"
  register: local_actions_private_mode
  delegate_to: localhost
  become: false

- name: Остановить, если локальному ключу нельзя выставить 0600
  ansible.builtin.fail:
    msg: >-
      Не удалось оставить {{ local_vps_dir }}/github-actions/id_ed25519 в режиме 0600
      (сейчас {{ local_actions_private_mode.stat.mode | default('неизвестно') }}).
      В WSL храните ключ в Linux-домашнем каталоге, не в /mnt/c.
  when: local_actions_private_mode.stat.mode | default('') != '0600'

- name: Подтвердить установку канонической локальной пары
  ansible.builtin.set_fact:
    actions_key_plan: >-
      {{
        {
          'local_private': true,
          'local_public': true,
          'local_matches_derived': 'yes',
          'server_private': server_actions_key_stats.results[0].stat.exists,
          'server_public': server_actions_key_stats.results[1].stat.exists
        } | classify_actions_key
      }}

- name: Поставить публичный ключ deploy, не трогая остальные
  ansible.builtin.authorized_key:
    user: "{{ deploy_user }}"
    state: present
    exclusive: false
    key: "{{ local_actions_pub_slurp.content | b64decode }}"
    manage_dir: true
  no_log: true
  diff: false
  when: actions_key_plan.action == 'install'

- name: Положить публичный ключ на VPS, если legacy-файлов нет
  ansible.builtin.copy:
    dest: "{{ devops_actions_pub }}"
    content: "{{ local_actions_pub_slurp.content | b64decode }}"
    owner: root
    group: root
    mode: "0644"
    force: false
  no_log: true
  diff: false
  when:
    - actions_key_plan.action == 'install'
    - not (server_actions_key_stats.results[0].stat.exists | bool)
    - not (server_actions_key_stats.results[1].stat.exists | bool)

- name: Запомнить, остался ли legacy-приватный ключ
  ansible.builtin.stat:
    path: "{{ devops_actions_key }}"
    checksum_algorithm: sha256
  register: remote_actions_private
