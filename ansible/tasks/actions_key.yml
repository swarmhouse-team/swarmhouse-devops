---
- name: Подготовить локальный каталог ключа Actions
  ansible.builtin.file:
    path: "{{ local_vps_dir }}/github-actions"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Подготовить локальную пару ключей Actions
  community.crypto.openssh_keypair:
    path: "{{ local_vps_dir }}/github-actions/id_ed25519"
    type: ed25519
    comment: "{{ devops_actions_comment }}"
    mode: "0600"
    regenerate: fail
  delegate_to: localhost
  become: false
  register: actions_keypair
  no_log: true

- name: Установить публичный ключ Actions для deploy
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ actions_keypair.public_key }}"
    state: present
    exclusive: false
  no_log: true
