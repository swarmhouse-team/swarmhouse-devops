---
- name: Проверить группу docker
  ansible.builtin.command: getent group docker
  register: docker_group
  changed_when: false
  failed_when: false

- name: Остановить, если группы docker нет
  ansible.builtin.fail:
    msg: >-
      Группа docker не найдена. Пользователя {{ deploy_user }} в неё не добавляю
      и группу сам не создаю: её должен создать пакет Docker.
  when: docker_group.rc != 0

- name: Проверить, есть ли пользователь deploy
  ansible.builtin.command: getent passwd {{ deploy_user }}
  register: deploy_passwd
  changed_when: false
  failed_when: deploy_passwd.rc not in [0, 2]

- name: Создать пользователя deploy
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: "{{ deploy_shell }}"
    create_home: true
    password_lock: true
    groups: docker
    append: true
  when: deploy_passwd.rc == 2

- name: Добавить существующего deploy в группу docker
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
  when: deploy_passwd.rc == 0

- name: Запомнить, создан ли пользователь
  ansible.builtin.set_fact:
    deploy_user_created: "{{ deploy_passwd.rc == 2 }}"

- name: Каталог SSH пользователя deploy
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/.ssh"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0700"
