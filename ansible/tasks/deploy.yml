---
- name: Пропустить запуск сервисов
  ansible.builtin.set_fact:
    deploy_applied: false
  when: not (deploy_services | bool)

- name: Зафиксировать, что запуск выключен
  ansible.builtin.debug:
    msg: >-
      deploy_services=false: контейнеры не запускаются.
      Чтобы поднять infrastructure_server и monitoring, повторите playbook с -e deploy_services=true.
  when: not (deploy_services | bool)

- name: Подготовить и запустить явный список сервисов
  when: deploy_services | bool
  block:
    - name: Проверить файлы, без которых Compose не стартует
      ansible.builtin.stat:
        path: "{{ devops_checkout }}/{{ item }}"
      loop:
        - .env
        - env/postgres.env
        - env/redis.env
        - env/grafana.env
        - env/postgres-exporter.env
        - env/redis-exporter.env
        - conf/postgres/postgresql.conf
        - conf/redis/redis.conf
        - conf/prometheus/prometheus.yml
        - conf/loki/config.yml
        - conf/alloy/config.alloy
        - conf/grafana/grafana.ini
        - conf/grafana/dashboards
      register: deploy_required_paths

    - name: Остановить, если файла Compose не хватает
      ansible.builtin.fail:
        msg: "Нет {{ item.stat.path }}. Запуск не начинаю."
      loop: "{{ deploy_required_paths.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"

    - name: Прочитать конфигурацию проектов Compose в JSON
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ devops_checkout }}"
          - --project-name
          - "{{ item.project_name }}"
          - -f
          - "{{ devops_checkout }}/{{ item.file }}"
          - config
          - --format
          - json
      loop: "{{ deploy_compose }}"
      register: deploy_compose_config
      changed_when: false
      no_log: true

    - name: Получить образы, порт Prometheus и параметры роли из Compose
      ansible.builtin.set_fact:
        deploy_images: "{{ dict(resolved_services.keys() | zip(resolved_services.values() | map(attribute='image'))) }}"
        deploy_prometheus_port: "{{ resolved_services.prometheus.ports[0].published }}"
        deploy_postgres_env:
          POSTGRES_USER: "{{ resolved_services.postgres.environment.POSTGRES_USER }}"
        deploy_exporter_env:
          DATA_SOURCE_USER: "{{ resolved_services['postgres-exporter'].environment.DATA_SOURCE_USER }}"
          # Compose экранирует доллары при сериализации конфигурации.
          DATA_SOURCE_PASS: "{{ resolved_services['postgres-exporter'].environment.DATA_SOURCE_PASS | replace('$$', '$') }}"
      vars:
        resolved_services: >-
          {{ (deploy_compose_config.results[0].stdout | from_json).services
             | combine((deploy_compose_config.results[1].stdout | from_json).services) }}
      no_log: true

    - name: Посчитать хеш конфигурации сервисов
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ devops_checkout }}"
          - --project-name
          - "{{ item.project_name }}"
          - -f
          - "{{ devops_checkout }}/{{ item.file }}"
          - config
          - --hash
          - "*"
      loop: "{{ deploy_compose }}"
      loop_control:
        label: "{{ item.project_name }}"
      register: deploy_hashes
      changed_when: false
      no_log: true

    - name: Собрать хеши сервисов
      ansible.builtin.set_fact:
        deploy_hash_map: >-
          {{
            deploy_hash_map | default({}) | combine(dict(item.stdout_lines | map('split')))
          }}
      loop: "{{ deploy_hashes.results }}"
      no_log: true

    - name: Собрать явный список сервисов
      ansible.builtin.set_fact:
        deploy_targets: "{{ deploy_targets | default([]) + [{'service': item.1, 'project': item.0.project_name, 'file': item.0.file}] }}"
      loop: "{{ deploy_compose | subelements('services') }}"

    - name: Прочитать уже существующие контейнеры по фиксированному имени
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{' }}.State.Status{{ '}}' }}|{{ '{{' }}.State.ExitCode{{ '}}' }}|{{ '{{' }}index .Config.Labels \"com.docker.compose.project\"{{ '}}' }}|{{ '{{' }}index .Config.Labels \"com.docker.compose.project.working_dir\"{{ '}}' }}|{{ '{{' }}index .Config.Labels \"com.docker.compose.service\"{{ '}}' }}|{{ '{{' }}.Config.Image{{ '}}' }}|{{ '{{' }}index .Config.Labels \"com.docker.compose.config-hash\"{{ '}}' }}"
          - "{{ item.service }}"
      loop: "{{ deploy_targets }}"
      loop_control:
        label: "{{ item.service }}"
      register: deploy_inspect
      changed_when: false
      failed_when: false

    - name: Составить план без секретов
      ansible.builtin.set_fact:
        deploy_plan: "{{ deploy_plan | default([]) + [plan_line] }}"
        deploy_conflicts: "{{ deploy_conflicts | default([]) + ([conflict_line] if (is_conflict | bool) else []) }}"
      loop: "{{ deploy_inspect.results }}"
      loop_control:
        label: "{{ item.item.service }}"
      vars:
        fields: "{{ item.stdout.split('|') if item.rc == 0 else [] }}"
        status: "{{ fields[0] | default('') }}"
        exit_code: "{{ fields[1] | default('') }}"
        project: "{{ fields[2] | default('') }}"
        workdir: "{{ fields[3] | default('') }}"
        service_label: "{{ fields[4] | default('') }}"
        image: "{{ fields[5] | default('') }}"
        config_hash: "{{ fields[6] | default('') }}"
        expected_image: "{{ deploy_images[item.item.service] }}"
        expected_hash: "{{ deploy_hash_map[item.item.service] | default('') }}"
        image_ok: "{{ image in [expected_image, 'docker.io/' ~ expected_image, 'docker.io/library/' ~ expected_image] }}"
        labels_ok: >-
          {{
            project == item.item.project
            and (workdir | regex_replace('/$', '')) == devops_checkout
            and service_label == item.item.service
          }}
        is_conflict: >-
          {{
            item.rc == 0 and (
              not (labels_ok | bool)
              or not (image_ok | bool)
              or config_hash != expected_hash
              or (item.item.service == 'alloy-init' and status == 'exited' and exit_code != '0')
              or status in ['paused', 'dead', 'removing']
            )
          }}
        plan_line: >-
          {{
            item.item.service ~ ': контейнера нет, будет создан в проекте ' ~ item.item.project
            if item.rc != 0
            else item.item.service ~ ': ' ~ status ~ ', проект ' ~ project ~ ', каталог ' ~ workdir ~ ', образ ' ~ image
          }}
        conflict_line: >-
          {{
            item.item.service ~ ' конфликтует с ' ~ item.item.project
            ~ ' (' ~ devops_checkout ~ ', ' ~ expected_image ~ '). Сейчас: проект '
            ~ project ~ ', каталог ' ~ workdir ~ ', сервис ' ~ service_label
            ~ ', образ ' ~ image ~ ', статус ' ~ status ~ ' ' ~ exit_code
            ~ ('; хеш Compose не совпадает с контейнером' if config_hash != expected_hash else '')
          }}

    - name: Показать план запуска
      ansible.builtin.debug:
        msg: "{{ deploy_plan }}"

    - name: Остановить при конфликте существующей конфигурации
      ansible.builtin.fail:
        msg: >-
          Контейнеры не меняю: {{ deploy_conflicts | join(' ; ') }}.
          compose down, удаление volumes и пересоздание не выполнялись.
          Другой project name и другой каталог не используются.
      when: deploy_conflicts | length > 0

    - name: Проверить внешние сети
      ansible.builtin.command:
        argv: ["docker", "network", "inspect", "--format", "{{ '{{' }}.Driver{{ '}}' }}", "{{ item }}"]
      loop: "{{ deploy_networks }}"
      register: deploy_network_inspect
      changed_when: false
      failed_when: false

    - name: Остановить, если сеть есть, но это не bridge
      ansible.builtin.fail:
        msg: "Сеть {{ item.item }} уже есть с драйвером {{ item.stdout }}. Её не меняю."
      loop: "{{ deploy_network_inspect.results }}"
      when:
        - item.rc == 0
        - item.stdout != 'bridge'
      loop_control:
        label: "{{ item.item }}"

    - name: Создать отсутствующие сети infra и monitoring
      community.docker.docker_network:
        name: "{{ item.item }}"
        driver: bridge
        state: present
      loop: "{{ deploy_network_inspect.results }}"
      when: item.rc != 0
      loop_control:
        label: "{{ item.item }}"

    - name: Создать data отдельно от корней сервисов
      ansible.builtin.file:
        path: "{{ devops_checkout }}/data"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Отказать до загрузки образов, если корень данных не каталог
      ansible.builtin.include_tasks: tasks/datadir_kind.yml
      vars:
        data_root: "{{ item }}"
      loop:
        - data/postgres
        - data/redis
        - data/prometheus
        - data/grafana
      loop_control:
        label: "{{ item }}"

    - name: Подготовить корни данных Redis, Prometheus и Grafana
      ansible.builtin.include_tasks: tasks/service_datadir.yml
      loop:
        - name: redis
          image: "{{ deploy_images.redis }}"
          tag: "{{ deploy_images.redis.split(':')[-1] }}"
          host: data/redis
          mount: /data
        - name: prometheus
          image: "{{ deploy_images.prometheus }}"
          tag: "{{ deploy_images.prometheus.split(':')[-1] }}"
          host: data/prometheus
          mount: /prometheus
        - name: grafana
          image: "{{ deploy_images.grafana }}"
          tag: "{{ deploy_images.grafana.split(':')[-1] }}"
          host: data/grafana
          mount: /var/lib/grafana
      loop_control:
        loop_var: data_mount
        label: "{{ data_mount.host }}"

    - name: Подготовить корень данных PostgreSQL
      ansible.builtin.include_tasks: tasks/postgres_datadir.yml

    - name: Запустить postgres и redis
      ansible.builtin.include_tasks: tasks/deploy_up.yml
      vars:
        compose_project: "{{ deploy_compose[0] }}"

    - name: Проверить доступ postgres к PGDATA
      ansible.builtin.include_tasks: tasks/postgres_access.yml

    - name: Создать объекты PostgreSQL для exporter
      ansible.builtin.include_tasks: tasks/postgres_exporter_role.yml

    - name: Запустить мониторинг
      ansible.builtin.include_tasks: tasks/deploy_up.yml
      vars:
        compose_project: "{{ deploy_compose[1] }}"

    - name: Проверить метрики PostgreSQL
      ansible.builtin.include_tasks: tasks/postgres_metrics.yml

    - name: Отметить, что запуск выполнен
      ansible.builtin.set_fact:
        deploy_applied: true
