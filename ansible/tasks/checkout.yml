---
- name: Проверить каталог checkout
  ansible.builtin.stat:
    path: "{{ devops_checkout }}"
  register: checkout_stat

- name: Остановить, если checkout существует и принадлежит не deploy
  ansible.builtin.fail:
    msg: >-
      {{ devops_checkout }} принадлежит {{ checkout_stat.stat.pw_name }},
      а не {{ deploy_user }}. Владельца не меняю и checkout не перезаписываю.
  when:
    - checkout_stat.stat.exists
    - checkout_stat.stat.pw_name != deploy_user

- name: Остановить, если вместо checkout лежит файл
  ansible.builtin.fail:
    msg: "{{ devops_checkout }} существует и это не каталог."
  when:
    - checkout_stat.stat.exists
    - not checkout_stat.stat.isdir

- name: Создать пустой каталог checkout
  ansible.builtin.file:
    path: "{{ devops_checkout }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"
  when: not checkout_stat.stat.exists

- name: Клонировать swarmhouse-devops по HTTPS
  ansible.builtin.git:
    repo: "{{ devops_repo_url }}"
    dest: "{{ devops_checkout }}"
    version: "{{ devops_git_version }}"
    update: false
    accept_newhostkey: false
  become_user: "{{ deploy_user }}"
  when: not checkout_stat.stat.exists

- name: Прочитать origin
  ansible.builtin.command: git remote get-url origin
  args:
    chdir: "{{ devops_checkout }}"
  register: checkout_origin
  changed_when: false
  become_user: "{{ deploy_user }}"

- name: Проверить, что origin — этот репозиторий
  ansible.builtin.assert:
    that:
      - checkout_origin.stdout | regex_replace('\\.git$', '') | regex_replace('git@github.com:', 'https://github.com/') | regex_replace('ssh://git@github.com/', 'https://github.com/') | lower
        == devops_repo_url | regex_replace('\\.git$', '') | lower
    fail_msg: >-
      origin checkout {{ checkout_origin.stdout }} не совпадает с {{ devops_repo_url }}.
      Каталог не обновляю.
    quiet: true

- name: Проверить чистое рабочее дерево
  ansible.builtin.command: git status --porcelain --untracked-files=no
  args:
    chdir: "{{ devops_checkout }}"
  register: checkout_dirty
  changed_when: false
  become_user: "{{ deploy_user }}"

- name: Остановить при локальных изменениях checkout
  ansible.builtin.fail:
    msg: >-
      В {{ devops_checkout }} есть изменения отслеживаемых файлов.
      reset, clean и stash не выполняю. Приведите дерево в порядок вручную
      и повторите bootstrap.
  when: checkout_dirty.stdout | length > 0

- name: Сравнить HEAD с ожидаемой версией
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ devops_checkout }}"
      - rev-parse
      - "{{ item }}"
  loop:
    - HEAD
    - "{{ devops_git_version }}^{commit}"
  register: checkout_revs
  changed_when: false
  failed_when: false
  become_user: "{{ deploy_user }}"

- name: Сравнить текущий HEAD с запрошенным ref
  ansible.builtin.set_fact:
    checkout_existed: "{{ checkout_stat.stat.exists }}"
    checkout_matches: >-
      {{
        checkout_revs.results[1].rc == 0
        and checkout_revs.results[0].rc == 0
        and checkout_revs.results[0].stdout == checkout_revs.results[1].stdout
      }}

- name: Остановить, если новый клон не на запрошенном ref
  ansible.builtin.fail:
    msg: >-
      Клон {{ devops_checkout }} не оказался на {{ devops_git_version }}.
      Ref должен быть запушен в GitHub. Каталог дальше не переключаю.
  when:
    - not (checkout_existed | bool)
    - not (checkout_matches | bool)

- name: Остановить, если ожидаемой версии нет в локальном checkout
  ansible.builtin.fail:
    msg: >-
      В локальном checkout нет объекта {{ devops_git_version }}.
      allow_checkout_switch=false, поэтому fetch и checkout не делаю.
      Запушьте ref в GitHub и повторите с -e allow_checkout_switch=true,
      либо укажите devops_git_version, который уже есть в этом checkout.
  when:
    - checkout_existed | bool
    - not (checkout_matches | bool)
    - checkout_revs.results[1].rc != 0
    - not (allow_checkout_switch | bool)

- name: Остановить, если HEAD не равен ожидаемой версии
  ansible.builtin.fail:
    msg: >-
      HEAD checkout {{ checkout_revs.results[0].stdout }}
      не равен {{ devops_git_version }} ({{ checkout_revs.results[1].stdout }}).
      allow_checkout_switch=false, существующий checkout не переключаю.
      Env, симлинки и секреты не менялись.
  when:
    - checkout_existed | bool
    - not (checkout_matches | bool)
    - checkout_revs.results[1].rc == 0
    - not (allow_checkout_switch | bool)

- name: Забрать запрошенный ref с GitHub
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ devops_checkout }}"
      - fetch
      - origin
      - "{{ devops_git_version }}"
  register: checkout_fetch_ref
  changed_when: false
  failed_when: false
  become_user: "{{ deploy_user }}"
  when:
    - checkout_existed | bool
    - not (checkout_matches | bool)
    - allow_checkout_switch | bool

- name: Забрать запрошенный ref как тег
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ devops_checkout }}"
      - fetch
      - origin
      - "tag"
      - "{{ devops_git_version }}"
  register: checkout_fetch_tag
  changed_when: false
  failed_when: false
  become_user: "{{ deploy_user }}"
  when:
    - checkout_existed | bool
    - not (checkout_matches | bool)
    - allow_checkout_switch | bool
    - checkout_fetch_ref.rc | default(1) != 0

- name: Остановить, если ref не запушен в GitHub
  ansible.builtin.fail:
    msg: >-
      В origin нет {{ devops_git_version }}.
      Ветка или тег должны быть запушены в GitHub до bootstrap.
      Checkout, env и секреты не меняю.
  when:
    - checkout_existed | bool
    - not (checkout_matches | bool)
    - allow_checkout_switch | bool
    - checkout_fetch_ref.rc | default(1) != 0
    - checkout_fetch_tag.rc | default(1) != 0

- name: Проверить, что запрошенный ref не содержит env
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ devops_checkout }}"
      - ls-tree
      - -r
      - --name-only
      - FETCH_HEAD
      - --
      - .env
      - env/postgres.env
      - env/redis.env
      - env/redis-exporter.env
      - env/postgres-exporter.env
      - env/grafana.env
  register: checkout_tracked_env
  changed_when: false
  become_user: "{{ deploy_user }}"
  when:
    - checkout_existed | bool
    - not (checkout_matches | bool)
    - allow_checkout_switch | bool

- name: Остановить, если переход затронет env или секреты
  ansible.builtin.fail:
    msg: >-
      {{ devops_git_version }} содержит отслеживаемые env-файлы:
      {{ checkout_tracked_env.stdout_lines | join(', ') }}.
      Переход не делаю: существующие env, симлинки и секреты не удаляю.
  when:
    - checkout_tracked_env is not skipped
    - checkout_tracked_env.stdout | default('') | length > 0

- name: Перейти на запрошенный ref без reset и clean
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ devops_checkout }}"
      - checkout
      - --detach
      - FETCH_HEAD
  register: checkout_switch
  changed_when: true
  become_user: "{{ deploy_user }}"
  when:
    - checkout_existed | bool
    - not (checkout_matches | bool)
    - allow_checkout_switch | bool
    - checkout_tracked_env is not skipped
    - checkout_tracked_env.stdout | default('') | length == 0

- name: Проверить HEAD после перехода
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ devops_checkout }}"
      - rev-parse
      - HEAD
      - FETCH_HEAD
  register: checkout_head_after
  changed_when: false
  become_user: "{{ deploy_user }}"
  when: checkout_switch is not skipped

- name: Остановить, если переход не попал в запрошенный коммит
  ansible.builtin.fail:
    msg: >-
      После checkout HEAD и FETCH_HEAD разошлись:
      {{ checkout_head_after.stdout }}.
      reset --hard не выполняю.
  when:
    - checkout_head_after is not skipped
    - checkout_head_after.stdout_lines | length < 2
      or checkout_head_after.stdout_lines[0] != checkout_head_after.stdout_lines[1]

- name: Запомнить, клонировали ли репозиторий сейчас
  ansible.builtin.set_fact:
    checkout_created: "{{ not checkout_stat.stat.exists }}"
    checkout_switched: "{{ checkout_switch is not skipped }}"
