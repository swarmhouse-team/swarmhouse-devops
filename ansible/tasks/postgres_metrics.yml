---
- name: Дождаться pg_up=1 в Prometheus
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json, sys, urllib.request
        url = "http://127.0.0.1:%s/api/v1/query?query=pg_up" % sys.argv[1]
        try:
            with urllib.request.urlopen(url, timeout=5) as response:
                body = json.load(response)
        except Exception:
            print("0")
            raise SystemExit(0)
        values = [
            row.get("value", ["", ""])[1]
            for row in body.get("data", {}).get("result", [])
        ]
        print("1" if "1" in values else "0")
      - "{{ deploy_prometheus_port }}"
  register: pg_up
  changed_when: false
  retries: "{{ (deploy_wait_timeout | int / 5) | round(0, 'ceil') | int }}"
  delay: 5
  until: pg_up.stdout == '1'

- name: Остановить, если exporter не читает PostgreSQL
  ansible.builtin.fail:
    msg: >-
      Prometheus на 127.0.0.1:{{ deploy_prometheus_port }} не вернул pg_up=1.
      Наличия контейнера postgres-exporter недостаточно.
      Volumes не удалялись.
  when: pg_up.stdout != '1'
