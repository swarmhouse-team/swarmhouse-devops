---
- name: Обновить индекс пакетов
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Установить Git, SSH-клиент и зависимости apt
  ansible.builtin.apt:
    name:
      - git
      - openssh-client
      - sudo
      - util-linux
      - ca-certificates
      - curl
      - gnupg
      - python3
      - python3-apt
    state: present
  become: true
  become_user: root
