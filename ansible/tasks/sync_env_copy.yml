---
- name: "Записать {{ sync_file }}"
  ansible.builtin.copy:
    dest: "{{ devops_env_dir }}/{{ sync_file }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
    content: "{{ sync_text }}"
  no_log: true
  diff: false

- name: "Обновить локальную копию {{ sync_file }}"
  block:
    - name: "Записать локальную копию {{ sync_file }}"
      ansible.builtin.copy:
        dest: "{{ local_vps_dir }}/env/{{ sync_file }}"
        content: "{{ sync_text }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
      diff: false
  rescue:
    - name: "Остановить после ошибки записи {{ sync_file }}"
      ansible.builtin.fail:
        msg: >-
          Серверный {{ sync_file }} мог обновиться, локальная копия — нет.
          Содержимое не показываю.
          Повторный bootstrap остановится на несовпадении этого файла.
          Сверьте обе копии локально, не публикуя секреты, выберите одну версию
          и приведите вторую к ней с режимом 0600.

- name: "Сверить серверный {{ sync_file }} после sync"
  ansible.builtin.stat:
    path: "{{ devops_env_dir }}/{{ sync_file }}"
    checksum_algorithm: sha256
  register: sync_server_after

- name: "Сверить локальный {{ sync_file }} после sync"
  ansible.builtin.stat:
    path: "{{ local_vps_dir }}/env/{{ sync_file }}"
    checksum_algorithm: sha256
  register: sync_local_after
  delegate_to: localhost
  become: false

- name: "Остановить, если локальная копия {{ sync_file }} не совпала"
  ansible.builtin.fail:
    msg: >-
      Серверный {{ sync_file }} мог обновиться, локальная копия — нет
      или не получила режим 0600. Содержимое не показываю.
      Повторный bootstrap остановится на несовпадении этого файла.
      Сверьте обе копии локально, не публикуя секреты, выберите одну версию
      и приведите вторую к ней с режимом 0600.
  when: >-
    sync_local_after.stat.checksum | default('') != sync_server_after.stat.checksum | default('')
    or sync_local_after.stat.mode | default('') != '0600'
