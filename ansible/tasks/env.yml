---
- name: Список env, которые читает Compose
  ansible.builtin.set_fact:
    compose_env_files:
      - { checkout: .env, secret: .env }
      - { checkout: env/postgres.env, secret: postgres.env }
      - { checkout: env/redis.env, secret: redis.env }
      - { checkout: env/redis-exporter.env, secret: redis-exporter.env }
      - { checkout: env/postgres-exporter.env, secret: postgres-exporter.env }
      - { checkout: env/grafana.env, secret: grafana.env }

- name: Найти отсутствующие env на сервере
  ansible.builtin.stat:
    path: "{{ devops_env_dir }}/{{ item.secret }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ compose_env_files }}"
  register: server_env_stats

- name: Собрать список отсутствующих env
  ansible.builtin.set_fact:
    missing_env_files: "{{ server_env_stats.results | rejectattr('stat.exists') | map(attribute='item.secret') | list }}"

- name: Проверить данные PostgreSQL перед созданием postgres.env
  when: "'postgres.env' in missing_env_files"
  block:
    - name: Проверить каталог данных PostgreSQL
      ansible.builtin.stat:
        path: "{{ devops_checkout }}/data/postgres"
        follow: true
      register: postgres_data_dir

    - name: Найти файлы и каталоги данных PostgreSQL
      ansible.builtin.find:
        paths: "{{ devops_checkout }}/data/postgres"
        file_type: any
        hidden: true
        recurse: false
      register: postgres_data_entries
      when: postgres_data_dir.stat.isdir | default(false)

    - name: Не создавать пароль поверх данных PostgreSQL
      ansible.builtin.assert:
        that: postgres_data_entries.matched | default(0) == 0
        fail_msg: >-
          В {{ devops_checkout }}/data/postgres уже есть данные.
          Восстановите {{ devops_env_dir }}/postgres.env из резервной копии перед bootstrap.

- name: Подготовить локальный каталог паролей
  ansible.builtin.file:
    path: "{{ local_vps_dir }}/passwords"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: missing_env_files | difference(['.env']) | length > 0

- name: Получить общий пароль Redis
  ansible.builtin.set_fact:
    redis_password: "{{ lookup('ansible.builtin.password', local_vps_dir ~ '/passwords/redis chars=ascii_letters,digits length=48') }}"
  when: missing_env_files | intersect(['redis.env', 'redis-exporter.env']) | length > 0
  no_log: true

- name: Создать отсутствующие env из шаблонов
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ devops_env_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
    force: false
  loop: "{{ missing_env_files }}"
  no_log: true
  diff: false

- name: Связать пути Compose с каталогом секретов
  ansible.builtin.file:
    src: "{{ devops_env_dir }}/{{ item.secret }}"
    path: "{{ devops_checkout }}/{{ item.checkout }}"
    state: link
    owner: root
    group: root
    follow: false
    force: false
  loop: "{{ compose_env_files }}"

- name: Подготовить локальный каталог копий env
  ansible.builtin.file:
    path: "{{ local_vps_dir }}/env"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Сохранить локальные копии серверных env
  ansible.builtin.fetch:
    src: "{{ devops_env_dir }}/{{ item.secret }}"
    dest: "{{ local_vps_dir }}/env/"
    flat: true
  loop: "{{ compose_env_files }}"
  no_log: true
  diff: false

- name: Закрыть доступ к локальным копиям env
  ansible.builtin.file:
    path: "{{ local_vps_dir }}/env/{{ item.secret }}"
    state: file
    mode: "0600"
  loop: "{{ compose_env_files }}"
  delegate_to: localhost
  become: false
