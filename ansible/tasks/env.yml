---
- name: Список env, которые читает Compose
  ansible.builtin.set_fact:
    compose_env_files:
      - { checkout: .env, secret: .env }
      - { checkout: env/postgres.env, secret: postgres.env }
      - { checkout: env/redis.env, secret: redis.env }
      - { checkout: env/redis-exporter.env, secret: redis-exporter.env }
      - { checkout: env/postgres-exporter.env, secret: postgres-exporter.env }
      - { checkout: env/grafana.env, secret: grafana.env }

- name: Проверить env в checkout, не переходя по ссылкам
  ansible.builtin.stat:
    path: "{{ devops_checkout }}/{{ item.checkout }}"
    follow: false
    checksum_algorithm: sha256
  loop: "{{ compose_env_files }}"
  loop_control:
    label: "{{ item.checkout }}"
  register: checkout_env_stats

- name: Проверить канонические env в каталоге секретов
  ansible.builtin.stat:
    path: "{{ devops_env_dir }}/{{ item.secret }}"
    checksum_algorithm: sha256
  loop: "{{ compose_env_files }}"
  loop_control:
    label: "{{ item.secret }}"
  register: secret_env_stats

- name: Остановить, если env в checkout указывает в другое место
  ansible.builtin.fail:
    msg: >-
      {{ item.stat.path }} — ссылка на {{ item.stat.lnk_source }},
      а не на {{ devops_env_dir }}/{{ item.item.secret }}.
      Ссылку не меняю и новый пароль не создаю.
  loop: "{{ checkout_env_stats.results }}"
  loop_control:
    label: "{{ item.item.checkout }}"
  when:
    - item.stat.islnk | default(false)
    - item.stat.lnk_source != devops_env_dir ~ '/' ~ item.item.secret

- name: Прочитать обычные env из checkout до копирования
  ansible.builtin.slurp:
    src: "{{ item.0.stat.path }}"
  loop: "{{ checkout_env_stats.results | zip(secret_env_stats.results) | list }}"
  loop_control:
    label: "{{ item.0.item.checkout }}"
  register: checkout_plain_slurp
  failed_when: false
  no_log: true
  diff: false
  when:
    - item.0.stat.exists
    - not (item.0.stat.islnk | default(false))
    - not (item.0.stat.isdir | default(false))
    - not item.1.stat.exists

- name: Найти заглушки в env checkout, который ещё не скопирован
  ansible.builtin.set_fact:
    checkout_placeholder_hits: "{{ checkout_placeholder_hits | default([]) + [item.file ~ ':' ~ item.key] }}"
  loop:
    - { file: postgres.env, key: POSTGRES_PASSWORD }
    - { file: redis.env, key: REDIS_PASSWORD }
    - { file: redis-exporter.env, key: REDIS_PASSWORD }
    - { file: postgres-exporter.env, key: DATA_SOURCE_PASS }
    - { file: grafana.env, key: GF_SECURITY_ADMIN_PASSWORD }
    - { file: grafana.env, key: GF_SERVER_ROOT_URL }
    - { file: grafana.env, key: JIRA_API_TOKEN }
    - { file: grafana.env, key: JIRA_USER }
  loop_control:
    label: "{{ item.file }}:{{ item.key }}"
  no_log: true
  when:
    - not ((checkout_plain_slurp.results | selectattr('item.0.item.secret', 'equalto', item.file) | first).skipped | default(false))
    - (checkout_plain_slurp.results | selectattr('item.0.item.secret', 'equalto', item.file) | first).content is defined
    - item.key in ((checkout_plain_slurp.results | selectattr('item.0.item.secret', 'equalto', item.file) | first).content | b64decode | parse_env)
    - ((checkout_plain_slurp.results | selectattr('item.0.item.secret', 'equalto', item.file) | first).content | b64decode | parse_env)[item.key] in env_placeholders

- name: Остановить, если в checkout env лежит заглушка
  ansible.builtin.fail:
    msg: >-
      В env checkout есть заглушки example: {{ checkout_placeholder_hits | join(', ') }}.
      Значения не показываю и в каталог секретов не копирую.
  when: checkout_placeholder_hits | default([]) | length > 0

- name: Скопировать уже существующий env checkout в каталог секретов
  ansible.builtin.copy:
    src: "{{ devops_checkout }}/{{ item.0.item.checkout }}"
    dest: "{{ devops_env_dir }}/{{ item.0.item.secret }}"
    owner: root
    group: root
    mode: "0600"
    remote_src: true
    force: false
  loop: "{{ checkout_env_stats.results | zip(secret_env_stats.results) | list }}"
  loop_control:
    label: "{{ item.0.item.secret }}"
  no_log: true
  diff: false
  when:
    - item.0.stat.exists
    - not (item.0.stat.islnk | default(false))
    - not (item.0.stat.isdir | default(false))
    - not item.1.stat.exists

- name: Повторно проверить канонические env
  ansible.builtin.stat:
    path: "{{ devops_env_dir }}/{{ item.secret }}"
    checksum_algorithm: sha256
  loop: "{{ compose_env_files }}"
  loop_control:
    label: "{{ item.secret }}"
  register: secret_env_stats

- name: Проверить локальные копии env до генерации секретов
  ansible.builtin.stat:
    path: "{{ local_vps_dir }}/env/{{ item.secret }}"
    checksum_algorithm: sha256
  loop: "{{ compose_env_files }}"
  loop_control:
    label: "{{ item.secret }}"
  register: local_env_before_generate
  delegate_to: localhost
  become: false

- name: Не создавать серверные env поверх сохранённой локальной копии
  ansible.builtin.fail:
    msg: >-
      Локальный файл {{ local_vps_dir }}/env/{{ item.1.item.secret }} уже есть,
      а {{ devops_env_dir }}/{{ item.1.item.secret }} на VPS нет.
      Содержимое не показываю. Новый секрет не генерирую и локальный файл не перезаписываю.
      Так бывает после пересоздания сервера, если каталог прошлого окружения сохранён.
      Новое окружение: другой inventory_hostname или свой local_vps_dir.
      Повторный запуск того же окружения использует тот же каталог.
      Прежнее окружение автоматически не восстанавливается: верните env
      в {{ devops_env_dir }} из своей резервной копии до этого playbook
      и отдельно проверьте, что файлы соответствуют данным БД.
  loop: "{{ secret_env_stats.results | zip(local_env_before_generate.results) | list }}"
  loop_control:
    label: "{{ item.1.item.secret }}"
  when: >-
    (item.0.stat.exists | bool) | env_copy_action(item.1.stat.exists | bool) == 'block_generate'

- name: Не генерировать пароли поверх уже существующих данных
  ansible.builtin.fail:
    msg: >-
      Найдены данные или контейнер {{ item.container }}, но нет
      {{ devops_env_dir }}/{{ item.secret }} и нет файла в checkout.
      Новый пароль не создаю. Верните прежний env или проверьте сервер вручную.
  loop:
    - { secret: postgres.env, container: postgres, marker: "{{ devops_checkout }}/data/postgres" }
    - { secret: redis.env, container: redis, marker: "{{ devops_checkout }}/data/redis" }
    - { secret: grafana.env, container: grafana, marker: "{{ devops_checkout }}/data/grafana" }
  loop_control:
    label: "{{ item.secret }}"
  when:
    - not (secret_env_stats.results | selectattr('item.secret', 'equalto', item.secret) | first).stat.exists
    - (item.container in existing_project_containers) or (item.marker in nonempty_data_dirs)

- name: Прочитать канонические env
  ansible.builtin.slurp:
    src: "{{ devops_env_dir }}/{{ item.secret }}"
  loop: "{{ compose_env_files }}"
  loop_control:
    label: "{{ item.secret }}"
  register: existing_env_slurp
  failed_when: false
  no_log: true
  diff: false

- name: Разобрать канонические env
  ansible.builtin.set_fact:
    stored_env: >-
      {{
        stored_env | default({}) | combine({
          item.item.secret: (item.content | b64decode | parse_env) if (item.content is defined) else {}
        })
      }}
  loop: "{{ existing_env_slurp.results }}"
  loop_control:
    label: "{{ item.item.secret }}"
  no_log: true
  diff: false

- name: Остановить, если существующий env пустой
  ansible.builtin.fail:
    msg: "{{ devops_env_dir }}/{{ env_stat.item.secret }} существует, но пустой. Файл не дополняю."
  loop: "{{ secret_env_stats.results }}"
  loop_control:
    loop_var: env_stat
    label: "{{ env_stat.item.secret }}"
  when:
    - env_stat.stat.exists | default(false)
    - env_stat.stat.size | default(1) | int == 0

- name: Найти заглушки example в существующих env
  ansible.builtin.set_fact:
    placeholder_hits: "{{ placeholder_hits | default([]) + [item.file ~ ':' ~ item.key] }}"
  loop:
    - { file: postgres.env, key: POSTGRES_PASSWORD }
    - { file: redis.env, key: REDIS_PASSWORD }
    - { file: redis-exporter.env, key: REDIS_PASSWORD }
    - { file: postgres-exporter.env, key: DATA_SOURCE_PASS }
    - { file: grafana.env, key: GF_SECURITY_ADMIN_PASSWORD }
    - { file: grafana.env, key: GF_SERVER_ROOT_URL }
    - { file: grafana.env, key: JIRA_API_TOKEN }
    - { file: grafana.env, key: JIRA_USER }
  when:
    - stored_env[item.file][item.key] is defined
    - stored_env[item.file][item.key] in env_placeholders
  loop_control:
    label: "{{ item.file }}:{{ item.key }}"
  no_log: true

- name: Остановить, если в env остались заглушки
  ansible.builtin.fail:
    msg: >-
      В существующих env остались заглушки из example: {{ placeholder_hits | join(', ') }}.
      Значения не показываю и не заменяю.
  when: placeholder_hits | default([]) | length > 0

- name: Проверить обязательные ключи существующих env
  ansible.builtin.set_fact:
    missing_env_keys: "{{ missing_env_keys | default([]) + [item.file ~ ':' ~ item.key] }}"
  loop:
    - { file: .env, key: TZ }
    - { file: .env, key: POSTGRES_PORT }
    - { file: .env, key: REDIS_PORT }
    - { file: .env, key: PROMETHEUS_PORT }
    - { file: .env, key: GRAFANA_PORT }
    - { file: .env, key: POSTGRES_TAG }
    - { file: .env, key: REDIS_TAG }
    - { file: .env, key: PROMETHEUS_VERSION }
    - { file: .env, key: GRAFANA_VERSION }
    - { file: .env, key: NODE_EXPORTER_VERSION }
    - { file: .env, key: POSTGRES_EXPORTER_VERSION }
    - { file: .env, key: REDIS_EXPORTER_VERSION }
    - { file: .env, key: LOKI_VERSION }
    - { file: .env, key: ALLOY_VERSION }
    - { file: .env, key: CADVISOR_VERSION }
    - { file: postgres.env, key: POSTGRES_DB }
    - { file: postgres.env, key: POSTGRES_USER }
    - { file: postgres.env, key: POSTGRES_PASSWORD }
    - { file: postgres.env, key: POSTGRES_INITDB_ARGS }
    - { file: redis.env, key: REDIS_PASSWORD }
    - { file: redis-exporter.env, key: REDIS_PASSWORD }
    - { file: grafana.env, key: GF_SECURITY_ADMIN_USER }
    - { file: grafana.env, key: GF_SECURITY_ADMIN_PASSWORD }
    - { file: postgres-exporter.env, key: DATA_SOURCE_USER }
    - { file: postgres-exporter.env, key: DATA_SOURCE_PASS }
  when:
    - (secret_env_stats.results | selectattr('item.secret', 'equalto', item.file) | first).stat.exists
    - item.key not in stored_env[item.file]
  loop_control:
    label: "{{ item.file }}:{{ item.key }}"

- name: Остановить при нехватке обязательных переменных
  ansible.builtin.fail:
    msg: "В существующих env нет переменных: {{ missing_env_keys | join(', ') }}. Файл не дополняю."
  when: missing_env_keys | default([]) | length > 0

- name: Остановить, если пароли Redis разошлись
  ansible.builtin.fail:
    msg: >-
      REDIS_PASSWORD в redis.env и redis-exporter.env различается.
      Общий пароль не перезаписываю.
  no_log: true
  when:
    - (secret_env_stats.results | selectattr('item.secret', 'equalto', 'redis.env') | first).stat.exists
    - (secret_env_stats.results | selectattr('item.secret', 'equalto', 'redis-exporter.env') | first).stat.exists
    - stored_env['redis.env'].REDIS_PASSWORD != stored_env['redis-exporter.env'].REDIS_PASSWORD

- name: Взять уже сохранённый пароль Redis
  ansible.builtin.set_fact:
    redis_password: "{{ stored_env['redis.env'].REDIS_PASSWORD | default(stored_env['redis-exporter.env'].REDIS_PASSWORD) }}"
  no_log: true
  when: >
    (secret_env_stats.results | selectattr('item.secret', 'equalto', 'redis.env') | first).stat.exists
    or (secret_env_stats.results | selectattr('item.secret', 'equalto', 'redis-exporter.env') | first).stat.exists

# secrets.token_hex даёт hex без $ — так пароль не ломает интерполяцию Compose.
- name: Сгенерировать пароль Redis один раз
  ansible.builtin.command: python3 -c "import secrets; print(secrets.token_hex(32))"
  register: generated_redis_password
  changed_when: false
  no_log: true
  diff: false
  when: redis_password is not defined

- name: Запомнить новый пароль Redis
  ansible.builtin.set_fact:
    redis_password: "{{ generated_redis_password.stdout }}"
  no_log: true
  when: redis_password is not defined

- name: Взять уже сохранённый пароль PostgreSQL
  ansible.builtin.set_fact:
    postgres_password: "{{ stored_env['postgres.env'].POSTGRES_PASSWORD }}"
  no_log: true
  when: (secret_env_stats.results | selectattr('item.secret', 'equalto', 'postgres.env') | first).stat.exists

- name: Сгенерировать пароль PostgreSQL один раз
  ansible.builtin.command: python3 -c "import secrets; print(secrets.token_hex(32))"
  register: generated_postgres_password
  changed_when: false
  no_log: true
  diff: false
  when: postgres_password is not defined

- name: Запомнить новый пароль PostgreSQL
  ansible.builtin.set_fact:
    postgres_password: "{{ generated_postgres_password.stdout }}"
  no_log: true
  when: postgres_password is not defined

- name: Взять уже сохранённый пароль экспортёра PostgreSQL
  ansible.builtin.set_fact:
    postgres_exporter_password: "{{ stored_env['postgres-exporter.env'].DATA_SOURCE_PASS }}"
  no_log: true
  when: (secret_env_stats.results | selectattr('item.secret', 'equalto', 'postgres-exporter.env') | first).stat.exists

- name: Сгенерировать отдельный пароль экспортёра PostgreSQL
  ansible.builtin.command: python3 -c "import secrets; print(secrets.token_hex(32))"
  register: generated_exporter_password
  changed_when: false
  no_log: true
  diff: false
  when: postgres_exporter_password is not defined

- name: Запомнить пароль экспортёра PostgreSQL
  ansible.builtin.set_fact:
    postgres_exporter_password: "{{ generated_exporter_password.stdout }}"
  no_log: true
  when: postgres_exporter_password is not defined

- name: Взять уже сохранённый пароль Grafana
  ansible.builtin.set_fact:
    grafana_admin_password: "{{ stored_env['grafana.env'].GF_SECURITY_ADMIN_PASSWORD }}"
  no_log: true
  when: (secret_env_stats.results | selectattr('item.secret', 'equalto', 'grafana.env') | first).stat.exists

- name: Сгенерировать пароль администратора Grafana
  ansible.builtin.command: python3 -c "import secrets; print(secrets.token_hex(32))"
  register: generated_grafana_password
  changed_when: false
  no_log: true
  diff: false
  when: grafana_admin_password is not defined

- name: Запомнить пароль Grafana
  ansible.builtin.set_fact:
    grafana_admin_password: "{{ generated_grafana_password.stdout }}"
  no_log: true
  when: grafana_admin_password is not defined

- name: Записать отсутствующий .env из .env.example
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../.env.example"
    dest: "{{ devops_env_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
    force: false
  when: not (secret_env_stats.results | selectattr('item.secret', 'equalto', '.env') | first).stat.exists

- name: Записать отсутствующие секретные env
  ansible.builtin.copy:
    dest: "{{ devops_env_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0600"
    force: false
    content: "{{ item.content }}"
  loop:
    - name: postgres.env
      content: |
        POSTGRES_DB={{ postgres_db }}
        POSTGRES_USER={{ postgres_user }}
        POSTGRES_PASSWORD={{ postgres_password }}
        POSTGRES_INITDB_ARGS={{ postgres_initdb_args }}
    - name: redis.env
      content: |
        REDIS_PASSWORD={{ redis_password }}
    - name: redis-exporter.env
      content: |
        REDIS_PASSWORD={{ redis_password }}
    - name: postgres-exporter.env
      content: |
        DATA_SOURCE_USER={{ postgres_exporter_user }}
        DATA_SOURCE_PASS={{ postgres_exporter_password }}
        DATA_SOURCE_URI=postgres:5432/postgres?sslmode=disable
    - name: grafana.env
      content: |
        GF_SECURITY_ADMIN_USER={{ grafana_admin_user }}
        GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}
        GF_SERVER_ROOT_URL=http://127.0.0.1:{{ grafana_bind_port }}
        GF_SERVER_PROTOCOL=http
        GF_SECURITY_COOKIE_SECURE=false
        GF_SECURITY_COOKIE_SAMESITE=lax
        GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION=false
        GF_USERS_ALLOW_SIGN_UP=false
        GF_USERS_ALLOW_ORG_CREATE=false
        GF_AUTH_ANONYMOUS_ENABLED=false
        GF_AUTH_BASIC_ENABLED=true
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  diff: false
  when: not (secret_env_stats.results | selectattr('item.secret', 'equalto', item.name) | first).stat.exists

- name: Связать отсутствующий путь Compose с каталогом секретов
  ansible.builtin.file:
    path: "{{ devops_checkout }}/{{ item.0.item.checkout }}"
    src: "{{ devops_env_dir }}/{{ item.0.item.secret }}"
    state: link
    force: false
  loop: "{{ checkout_env_stats.results | zip(secret_env_stats.results) | list }}"
  loop_control:
    label: "{{ item.0.item.checkout }}"
  when:
    - not item.0.stat.exists
    - not (item.0.stat.islnk | default(false))

- name: Проверить итоговые ссылки env
  ansible.builtin.stat:
    path: "{{ devops_checkout }}/{{ item.checkout }}"
    follow: false
    checksum_algorithm: sha256
  loop: "{{ compose_env_files }}"
  loop_control:
    label: "{{ item.checkout }}"
  register: checkout_env_final

- name: Проверить итоговые файлы секретов
  ansible.builtin.stat:
    path: "{{ devops_env_dir }}/{{ item.secret }}"
    checksum_algorithm: sha256
  loop: "{{ compose_env_files }}"
  loop_control:
    label: "{{ item.secret }}"
  register: secret_env_final

- name: Не подменять env, который расходится с каталогом секретов
  ansible.builtin.fail:
    msg: >-
      {{ devops_checkout }}/{{ item.0.item.checkout }} уже существует и не совпадает с
      {{ devops_env_dir }}/{{ item.0.item.secret }}. Файл не перезаписываю.
  loop: "{{ checkout_env_final.results | zip(secret_env_final.results) | list }}"
  loop_control:
    label: "{{ item.0.item.checkout }}"
  when: >
    item.0.stat.exists and not (
      (item.0.stat.islnk | default(false)
        and item.0.stat.lnk_source == devops_env_dir ~ '/' ~ item.0.item.secret)
      or
      (not (item.0.stat.islnk | default(false))
        and item.0.stat.checksum == item.1.stat.checksum)
    )
