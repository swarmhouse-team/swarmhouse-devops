---
- name: deploy не должен быть в группе docker
  ansible.builtin.command: id -nG {{ deploy_user }}
  register: deploy_groups
  changed_when: false
  failed_when: deploy_groups.rc != 0 or 'docker' in deploy_groups.stdout.split()

- name: Прочитать sudo deploy
  ansible.builtin.command: sudo -l -U {{ deploy_user }}
  environment:
    LC_ALL: C
  register: deploy_sudo
  changed_when: false

- name: sudo deploy разрешён только для двух скриптов выкладки
  ansible.builtin.assert:
    that:
      - deploy_sudo_rules | length == 2
      - deploy_sudo_rules | select('match', '^[(]root[)]\s+NOPASSWD:\s*/usr/local/sbin/swarmhouse-infra-deploy\s+[*]$') | list | length == 1
      - deploy_sudo_rules | select('match', '^[(]root[)]\s+NOPASSWD:\s*/usr/local/sbin/swarmhouse-app-deploy\s+[*]$') | list | length == 1
    fail_msg: >-
      sudo -l для {{ deploy_user }} должен разрешать только swarmhouse-infra-deploy и
      swarmhouse-app-deploy. Найдено: {{ deploy_sudo_rules }}
    quiet: true
  vars:
    deploy_sudo_rules: >-
      {{ deploy_sudo.stdout.split('may run the following commands')[-1].splitlines()[1:]
         | map('trim') | select | list }}
