---
# Удаляет только временный приватный ключ на VPS.
# Публичный ключ и authorized_keys не трогает.
# Запускать после того, как локальная копия сохранена и вход deploy проверен.
- name: Удалить временную копию приватного ключа Actions на VPS
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Требовать отдельное подтверждение удаления
      ansible.builtin.fail:
        msg: >-
          Ключ не удалён. Сначала проверьте вход deploy локальной копией,
          затем запустите cleanup-actions-key.yml с -e confirm_actions_key_cleanup=true.
          Содержимое ключа playbook не показывает.
      when: not (confirm_actions_key_cleanup | default(false) | bool)

    - name: Проверить публичный ключ
      ansible.builtin.stat:
        path: "{{ devops_actions_pub }}"
      register: cleanup_pub

    - name: Остановить, если публичного ключа нет
      ansible.builtin.fail:
        msg: >-
          {{ devops_actions_pub }} не найден. Приватный ключ не удаляю:
          без публичной части нельзя понять, какая пара установлена.
      when: not cleanup_pub.stat.exists

    - name: Проверить приватный ключ на VPS
      ansible.builtin.stat:
        path: "{{ devops_actions_key }}"
        checksum_algorithm: sha256
      register: cleanup_remote

    - name: Проверить локальную копию приватного ключа
      ansible.builtin.stat:
        path: "{{ local_vps_dir }}/github-actions/id_ed25519"
        checksum_algorithm: sha256
      register: cleanup_local
      delegate_to: localhost
      become: false

    - name: Остановить, если локальной копии нет
      ansible.builtin.fail:
        msg: >-
          На управляющей машине нет {{ local_vps_dir }}/github-actions/id_ed25519.
          Серверный файл не удаляю: это единственная оставшаяся копия.
      when:
        - cleanup_remote.stat.exists
        - not cleanup_local.stat.exists

    - name: Остановить, если копии различаются
      ansible.builtin.fail:
        msg: >-
          Локальный ключ и {{ devops_actions_key }} не совпадают.
          Серверный файл не удаляю.
      when:
        - cleanup_remote.stat.exists
        - cleanup_local.stat.exists
        - cleanup_remote.stat.checksum != cleanup_local.stat.checksum

    - name: Удалить временный приватный ключ с VPS
      ansible.builtin.file:
        path: "{{ devops_actions_key }}"
        state: absent
      when: cleanup_remote.stat.exists

    - name: Убедиться, что публичный ключ на месте
      ansible.builtin.stat:
        path: "{{ devops_actions_pub }}"
      register: cleanup_pub_after

    - name: Остановить, если публичный ключ пропал
      ansible.builtin.assert:
        that:
          - cleanup_pub_after.stat.exists
        fail_msg: "{{ devops_actions_pub }} пропал. Это не ожидаемый результат cleanup."
        quiet: true

    - name: Сообщить результат
      ansible.builtin.debug:
        msg: >-
          Временный файл {{ devops_actions_key }} удалён или его уже не было.
          {{ devops_actions_pub }} и authorized_keys сохранены.
          Удаление — обычный unlink, не гарантированное затирание блоков на диске.
          Локальная копия остаётся в {{ local_vps_dir }}/github-actions/id_ed25519.
