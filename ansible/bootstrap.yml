---
# Подготовка VPS. Контейнеры запускаются только при deploy_services=true.
- name: Подготовить VPS к swarmhouse
  hosts: all
  become: true
  gather_facts: true
  vars_prompt:
    - name: jira_user
      prompt: JIRA_USER (можно оставить пустым)
      private: true
      default: ""
    - name: jira_api_token
      prompt: JIRA_API_TOKEN (можно оставить пустым)
      private: true
      default: ""
  handlers:
    - name: Перечитать конфигурацию SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
  tasks:
    - name: Предварительные проверки
      ansible.builtin.import_tasks: tasks/preflight.yml

    - name: Пакеты
      ansible.builtin.import_tasks: tasks/packages.yml

    - name: Docker
      ansible.builtin.import_tasks: tasks/docker.yml

    - name: Пользователь deploy
      ansible.builtin.import_tasks: tasks/user.yml

    - name: Каталоги
      ansible.builtin.import_tasks: tasks/directories.yml

    - name: Checkout swarmhouse-devops
      ansible.builtin.import_tasks: tasks/checkout.yml

    - name: Скрипт деплоя и sudo
      ansible.builtin.import_tasks: tasks/deploy_sudo.yml

    - name: Ключ GitHub Actions
      ansible.builtin.import_tasks: tasks/actions_key.yml

    - name: Применить конфигурацию SSH
      ansible.builtin.meta: flush_handlers

    - name: Env и секреты
      ansible.builtin.import_tasks: tasks/env.yml

    - name: Запуск сервисов
      ansible.builtin.import_tasks: tasks/services.yml

    - name: Бэкап PostgreSQL
      ansible.builtin.import_tasks: tasks/backup.yml

    - name: Запуск приложения
      ansible.builtin.import_tasks: tasks/application.yml
      when: deploy_services | bool and deploy_application | bool

    - name: Проверить права deploy
      ansible.builtin.import_tasks: tasks/verify.yml

    - name: Показать параметры GitHub и итог бэкапа
      ansible.builtin.debug:
        msg:
          - "DEPLOY_SSH_KEY: содержимое {{ local_vps_dir }}/github-actions/id_ed25519"
          - "APP_DEPLOY_SSH_KEY: содержимое {{ local_vps_dir }}/github-actions/app_id_ed25519"
          - "DEPLOY_KNOWN_HOSTS: проверенный ключ хоста SSH"
          - "DEPLOY_HOST: {{ ansible_host | default(inventory_hostname) }}"
          - "DEPLOY_USER: {{ deploy_user }}"
          - "DEPLOY_PORT: {{ ansible_port | default(22) }}"
          - "Тестовый бэкап, восстановление и cron root: {{ 'готово' if backup_test_ok | default(false) else 'пропущено' }}"
