---
# Подготовка VPS. Контейнеры запускаются только при deploy_services=true.
- name: Подготовить VPS к swarmhouse
  hosts: all
  become: true
  gather_facts: true
  vars_prompt:
    - name: jira_user
      prompt: JIRA_USER (можно оставить пустым)
      private: true
      default: ""
    - name: jira_api_token
      prompt: JIRA_API_TOKEN (можно оставить пустым)
      private: true
      default: ""
  tasks:
    - name: Предварительные проверки
      ansible.builtin.import_tasks: tasks/preflight.yml

    - name: Пакеты
      ansible.builtin.import_tasks: tasks/packages.yml

    - name: Docker
      ansible.builtin.import_tasks: tasks/docker.yml

    - name: Пользователь deploy
      ansible.builtin.import_tasks: tasks/user.yml

    - name: Каталоги
      ansible.builtin.import_tasks: tasks/directories.yml

    - name: Ключ GitHub Actions
      ansible.builtin.import_tasks: tasks/actions_key.yml

    - name: Checkout swarmhouse-devops
      ansible.builtin.import_tasks: tasks/checkout.yml

    - name: Скрипт деплоя и sudo
      ansible.builtin.import_tasks: tasks/deploy_sudo.yml

    - name: Env и секреты
      ansible.builtin.import_tasks: tasks/env.yml

    - name: Запуск сервисов
      ansible.builtin.import_tasks: tasks/deploy.yml

    - name: Бэкап PostgreSQL
      ansible.builtin.import_tasks: tasks/backup.yml

    - name: Проверки и отчёт
      ansible.builtin.import_tasks: tasks/verify.yml
