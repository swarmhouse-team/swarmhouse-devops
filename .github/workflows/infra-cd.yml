name: Infrastructure CD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy PostgreSQL, Redis and monitoring
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Set DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set DEPLOY_USER}"
          : "${DEPLOY_PORT:?Set DEPLOY_PORT}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS}"

          [[ "$DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ ]]
          (( DEPLOY_PORT <= 65535 ))
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_SSH_KEY" \
            | tr -d '\r' > "$HOME/.ssh/deploy_key"

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" \
            | tr -d '\r' > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -P "" \
            -f "$HOME/.ssh/deploy_key" > /dev/null

      - name: Deploy infrastructure
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/local/sbin/swarmhouse-infra-deploy '$DEPLOY_SHA'"

      - name: Remove SSH credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/deploy_key"
          rm -f "$HOME/.ssh/known_hosts"